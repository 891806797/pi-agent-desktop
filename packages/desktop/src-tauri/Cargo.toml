[package]
name = "pi-agent-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "pi_agent_desktop"
crate-type = ["rlib"]

[dependencies]
futures-util = "0.3.34"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
tauri-build = "2.7.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }

[target."cfg(unix)".dependencies]
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }


